name: PIM Mark-1

# Manual workflow for validating, previewing, deploying, and auditing PIM access.
on:
  workflow_dispatch:
    inputs:
      deploy_pim:
        description: 'Create the PIM eligibility request'
        type: boolean
        required: true
        default: false
      view_access:
        description: 'Generate a report of the target user and their Azure access'
        type: boolean
        required: true
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: 01 - Validate input and build Bicep
    runs-on: ubuntu-latest
    environment: bifrost-dev
    outputs:
      subscription_id: ${{ steps.config.outputs.subscription_id }}
      tenant_id: ${{ steps.config.outputs.tenant_id }}
      principal_id: ${{ steps.config.outputs.principal_id }}
      role_definition_id: ${{ steps.config.outputs.role_definition_id }}
      request_name: ${{ steps.config.outputs.request_name }}
      scope_id: ${{ steps.config.outputs.scope_id }}
      scope_type: ${{ steps.config.outputs.scope_type }}
      request_type: ${{ steps.config.outputs.request_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI and Bicep
        run: |
          az version
          az bicep install
          az bicep version

      - name: Build PIM Bicep module
        run: az bicep build --file modules/pim/pim.bicep --stdout >/dev/null

      - name: Validate input.json and prepare outputs
        id: config
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          jq empty input.json

          python - <<'PY'
          import json
          import os
          import re
          import uuid

          with open("input.json", encoding="utf-8") as file:
              c = json.load(file)

          pim = c["pim"]
          user = pim["user"]
          role = pim["role"]
          sub = c["subscription"].get("subscriptionId", "").strip()
          tenant = os.environ.get("AZURE_TENANT_ID", "")
          principal = user["principalId"]

          guid = r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(c["request"]["approved"] is True, "Request must be approved in input.json.")
          require(c["subscription"]["name"] == "BIFROST-SC", "Only BIFROST-SC is allowed for this branch.")
          require(bool(re.fullmatch(guid, sub)), "Set subscription.subscriptionId in input.json to a valid GUID (JSON does not expand environment variables).")
          require(bool(re.fullmatch(guid, tenant)), "Set valid AZURE_TENANT_ID in GitHub environment bifrost-dev.")
          require(pim["enabled"] is True, "pim.enabled must be true.")
          require(pim["assignmentType"] == "Eligibility", "This workflow only supports PIM eligibility.")
          require(user["alias"] == "pim_user_1", "Expected user alias pim_user_1.")
          require(user["principalType"] == "User", "This workflow only supports User principals.")
          require(bool(re.fullmatch(guid, principal)), "Replace principalId with the user's Entra Object ID (GUID).")
          require(bool(re.fullmatch(guid, role["roleDefinitionId"].strip())) or (role["roleDefinitionId"].strip().startswith("/") and "/providers/Microsoft.Authorization/roleDefinitions/" in role["roleDefinitionId"]), "roleDefinitionId must be a role GUID or full Azure role definition ID.")
          scope = pim["scope"]
          scope_type = scope.get("type", "")
          require(scope_type in ("Subscription", "ResourceGroup", "Resource"), "scope.type must be Subscription, ResourceGroup, or Resource.")
          if scope_type == "Subscription":
              scope_id = f"/subscriptions/{sub}"
          elif scope_type == "ResourceGroup":
              rg_name = scope.get("resourceGroupName", "")
              require(bool(rg_name), "scope.resourceGroupName is required for ResourceGroup.")
              scope_id = f"/subscriptions/{sub}/resourceGroups/{rg_name}"
          else:
              scope_id = scope.get("resourceId", "")
              require(scope_id.startswith(f"/subscriptions/{sub}/") and "/providers/" in scope_id and scope_id.count("/") >= 8, "scope.resourceId must be a full ARM resource ID inside the configured subscription.")

          request_type = pim.get("requestType", "AdminAssign")
          allowed_types = {"AdminAssign", "AdminUpdate", "AdminRemove", "AdminExtend", "AdminRenew", "SelfActivate", "SelfDeactivate", "SelfExtend", "SelfRenew"}
          require(request_type in allowed_types, "Unsupported PIM requestType.")
          require(request_type == "AdminAssign", "Workflow currently executes AdminAssign. Other request types need existing schedule IDs and/or user-context flow.")
          require(pim["schedule"]["expirationType"] in ("AfterDuration", "AfterDateTime", "NoExpiration"), "Unsupported expirationType.")
          if pim["schedule"]["expirationType"] == "AfterDuration":
              require(pim["schedule"]["duration"].startswith("P"), "Use an ISO 8601 duration such as P90D.")

          request = str(uuid.uuid5(
              uuid.NAMESPACE_URL,
              sub + principal + role["roleDefinitionId"] + pim["ticketInfo"]["ticketNumber"]
          ))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"subscription_id={sub}\n")
              f.write(f"tenant_id={tenant}\n")
              f.write(f"principal_id={principal}\n")
              f.write(f"role_definition_id={role['roleDefinitionId']}\n")
              f.write(f"request_name={request}\n")
              f.write(f"scope_id={scope_id}\n")
              f.write(f"scope_type={scope_type}\n")
              f.write(f"request_type={request_type}\n")
          PY

  create_pim:
    name: 02 - Create PIM eligibility access
    needs: validate
    if: ${{ inputs.deploy_pim == true }}
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}

      - name: Verify subscription context and target scope access
        env:
          TARGET_SUBSCRIPTION_ID: ${{ needs.validate.outputs.subscription_id }}
          TARGET_SCOPE_ID: ${{ needs.validate.outputs.scope_id }}
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$TARGET_SUBSCRIPTION_ID"
          ACTIVE_SUB="$(az account show --query id --output tsv)"
          if [[ "${ACTIVE_SUB,,}" != "${TARGET_SUBSCRIPTION_ID,,}" ]]; then
            echo "Azure CLI context does not match subscription.subscriptionId from input.json." >&2
            exit 1
          fi
          echo "Authenticated subscription context: $ACTIVE_SUB"
          az role assignment list --scope "$TARGET_SCOPE_ID" --include-inherited --all --output none
          echo "Target scope is readable by the authenticated GitHub OIDC identity."

      - name: Submit PIM eligibility request at selected scope
        env:
          SCOPE_ID: ${{ needs.validate.outputs.scope_id }}
          SUBSCRIPTION_ID: ${{ needs.validate.outputs.subscription_id }}
          PRINCIPAL_ID: ${{ needs.validate.outputs.principal_id }}
          REQUEST_NAME: ${{ needs.validate.outputs.request_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          with open("input.json", encoding="utf-8") as f:
              config = json.load(f)
          pim = config["pim"]
          role = pim["role"]["roleDefinitionId"]
          if role.startswith("/"):
              role_id = role
          else:
              role_id = f'/subscriptions/{os.environ["SUBSCRIPTION_ID"]}/providers/Microsoft.Authorization/roleDefinitions/{role}'
          schedule = pim["schedule"]
          expiration_type = schedule.get("expirationType", "AfterDuration")
          expiration = {"type": expiration_type}
          if expiration_type == "AfterDuration":
              expiration["duration"] = schedule.get("duration", "P90D")
          elif expiration_type == "AfterDateTime":
              expiration["endDateTime"] = schedule["endDateTime"]
          body = {"properties": {
              "principalId": pim["user"]["principalId"],
              "roleDefinitionId": role_id,
              "requestType": pim.get("requestType", "AdminAssign"),
              "justification": pim["justification"],
              "ticketInfo": pim["ticketInfo"],
              "scheduleInfo": {
                  "startDateTime": schedule.get("startDateTime") or None,
                  "expiration": expiration
              }
          }}
          url = f'https://management.azure.com{os.environ["SCOPE_ID"]}/providers/Microsoft.Authorization/roleEligibilityScheduleRequests/{os.environ["REQUEST_NAME"]}?api-version=2024-09-01-preview'
          subprocess.run(["az", "rest", "--method", "put", "--url", url, "--body", json.dumps(body), "--output", "json"], check=True)
          PY

  access_report:
    name: 04 - View user details and Azure access
    needs: [validate, create_pim]
    if: ${{ always() && needs.validate.result == 'success' && inputs.view_access == true }}
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}

      - name: Collect user details and Azure access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.subscription_id }}
          TARGET_SCOPE_ID: ${{ needs.validate.outputs.scope_id }}
          PRINCIPAL_ID: ${{ needs.validate.outputs.principal_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p access-report

          # User profile lookup requires suitable Microsoft Graph directory-read permissions.
          if az ad user show --id "$PRINCIPAL_ID" \
              --query "{displayName:displayName,userPrincipalName:userPrincipalName,id:id,accountEnabled:accountEnabled}" \
              --output json > access-report/user-details.json 2>access-report/user-details-error.txt; then
            echo "User profile collected."
          else
            echo '{"warning":"Unable to read Entra user profile. Ensure the OIDC app has Microsoft Graph read permissions."}' > access-report/user-details.json
          fi

          # Collect active RBAC role assignments on the subscription and its descendants.
          az role assignment list \
            --assignee "$PRINCIPAL_ID" \
            --scope "/subscriptions/$AZURE_SUBSCRIPTION_ID" \
            --include-inherited \
            --all \
            --output json > access-report/active-role-assignments.json

          # Collect PIM eligible role assignment instances. This can fail if PIM is unlicensed/unavailable.
          PIM_URL="https://management.azure.com$TARGET_SCOPE_ID/providers/Microsoft.Authorization/roleEligibilityScheduleInstances?api-version=2020-10-01&\$filter=principalId%20eq%20%27$PRINCIPAL_ID%27"
          if az rest --method get --url "$PIM_URL" --output json > access-report/pim-eligible-assignments.json 2>access-report/pim-eligible-error.txt; then
            echo "PIM eligibility data collected."
          else
            echo '{"warning":"PIM eligibility could not be retrieved; verify tenant licensing/onboarding and API permissions."}' > access-report/pim-eligible-assignments.json
          fi

          {
            echo "## BIFROST PIM Access Report"
            echo ""
            echo "- **Subscription:** $AZURE_SUBSCRIPTION_ID"
            echo "- **Scope:** $TARGET_SCOPE_ID"
            echo "- **Target Entra Object ID:** $PRINCIPAL_ID"
            echo "- **Generated (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "### Entra user details"
            echo '~~~json'
            cat access-report/user-details.json
            echo '~~~'
            echo ""
            echo "### Active Azure RBAC assignments"
            echo "Full details are available in the workflow artifact."
            echo '~~~json'
            jq '[.[] | {role: .roleDefinitionName, scope: .scope, principalId: .principalId, condition: .condition}]' access-report/active-role-assignments.json
            echo '~~~'
            echo ""
            echo "### PIM eligible assignments"
            echo "Full details are available in the workflow artifact."
            echo '~~~json'
            jq '[.value[]? | {roleDefinitionId: .properties.roleDefinitionId, scope: .properties.scope, principalId: .properties.principalId, status: .properties.status, startDateTime: .properties.startDateTime, endDateTime: .properties.endDateTime}]' access-report/pim-eligible-assignments.json 2>/dev/null || cat access-report/pim-eligible-assignments.json
            echo '~~~'
            echo ""
            echo "> Active RBAC and PIM eligible assignments are shown separately. Eligibility does not mean the role is activated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload access report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-pim-access-report-${{ github.run_number }}
          path: access-report/
          retention-days: 30
