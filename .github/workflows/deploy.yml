name: BIFROST | Input JSON Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: 'Deploy after validation and What-If (false = preview only)'
        type: boolean
        required: true
        default: false
      deploy_pim:
        description: 'Create PIM eligibility request (requires privileged permissions)'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: 01 - Bicep lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify Bicep
        run: |
          set -euo pipefail
          az --version
          az bicep install
          az bicep version
      - name: Build all Bicep templates
        run: |
          set -euo pipefail
          az bicep build --file modules/main.bicep --stdout >/dev/null
          az bicep build --file modules/resource-group/resource-group.bicep --stdout >/dev/null
          az bicep build --file modules/networking/nsg.bicep --stdout >/dev/null
          az bicep build --file modules/networking/vnet.bicep --stdout >/dev/null
          az bicep build --file modules/compute/vm-linux.bicep --stdout >/dev/null
          az bicep build --file modules/pim/pim.bicep --stdout >/dev/null
      - name: Validate input JSON
        run: jq empty input.json

  validate:
    name: 02 - Validate configuration
    needs: lint
    runs-on: ubuntu-latest
    environment: bifrost-dev
    outputs:
      subscription_id: ${{ steps.config.outputs.subscription_id }}
      tenant_id: ${{ steps.config.outputs.tenant_id }}
      location: ${{ steps.config.outputs.location }}
      rg_name: ${{ steps.config.outputs.rg_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate input.json and GitHub Environment values
        id: config
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress,json,os
          c=json.load(open("input.json",encoding="utf-8"))
          def need(ok,msg):
              if not ok: raise SystemExit(msg)
          need(c["request"]["approved"] is True,"request.approved must be true")
          need(c["request"]["environment"]=="dev","Only dev environment is supported")
          need(c["subscription"]["name"]=="BIFROST-SC","Only BIFROST-SC is permitted")
          subscription_id=os.environ.get("AZURE_SUBSCRIPTION_ID","").strip()
          tenant_id=os.environ.get("AZURE_TENANT_ID","").strip()
          need(bool(subscription_id),"GitHub Environment variable AZURE_SUBSCRIPTION_ID is missing")
          need(bool(tenant_id),"GitHub Environment variable AZURE_TENANT_ID is missing")
          need(c["subscription"]["subscriptionId"]=="${AZURE_SUBSCRIPTION_ID}","input.json subscriptionId must use the AZURE_SUBSCRIPTION_ID placeholder")
          rg=c["resourceGroup"]["name"]; vm=c["virtualMachine"]; net=vm["network"]
          need(vm["resourceGroupName"]==rg,"VM resourceGroupName must equal resourceGroup.name")
          need(c["pim"]["scope"]["resourceGroupName"]==rg,"PIM scope RG must equal resourceGroup.name")
          need(vm["sshPublicKey"].startswith("ssh-") and "<" not in vm["sshPublicKey"],"Set a real SSH public key")
          ip=ipaddress.ip_network(net["sshAllowedSourceAddressPrefix"],strict=False)
          need(ip.prefixlen==ip.max_prefixlen,"SSH CIDR must be one host (/32 or /128)")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"subscription_id={subscription_id}\n")
              f.write(f"tenant_id={tenant_id}\n")
              f.write(f"location={c['deployment']['location']}\n")
              f.write(f"rg_name={rg}\n")
          PY

  prepare:
    name: 03 - Generate deployment parameters
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary bicepparam from input.json
        env:
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.subscription_id }}
          DEPLOY_PIM: ${{ inputs.deploy_pim }}
        run: |
          set -euo pipefail
          jq --arg subscriptionId "$AZURE_SUBSCRIPTION_ID" '.subscription.subscriptionId = $subscriptionId' input.json > input.generated.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          def bicep(value):
              if isinstance(value,dict):
                  return "{ " + ", ".join(f"{key}: {bicep(item)}" for key,item in value.items()) + " }"
              if isinstance(value,list):
                  return "[" + ", ".join(bicep(item) for item in value) + "]"
              if isinstance(value,str):
                  return "'" + value.replace("'","''") + "'"
              if value is True: return "true"
              if value is False: return "false"
              if value is None: return "null"
              return str(value)
          config=json.loads(Path("input.generated.json").read_text(encoding="utf-8"))
          pim=os.environ["DEPLOY_PIM"].lower()=="true"
          Path("deployment.generated.bicepparam").write_text(
              "using './modules/main.bicep'\n"
              f"param config = {bicep(config)}\n"
              f"param deployPim = {str(pim).lower()}\n",encoding="utf-8")
          PY
          chmod 600 deployment.generated.bicepparam
          rm -f input.generated.json
      - name: Upload generated deployment parameters
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-deployment-params
          path: deployment.generated.bicepparam
          retention-days: 1

  what-if:
    name: 04 - Azure What-If preview
    needs: [validate,prepare]
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-deployment-params
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Verify Azure account context
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "${{ needs.validate.outputs.subscription_id }}"
          test "$(az account show --query tenantId -o tsv)" = "${{ needs.validate.outputs.tenant_id }}"
      - name: Subscription deployment What-If
        run: |
          az deployment sub what-if --name "BIFROST-WhatIf-${{ github.run_number }}" --location "${{ needs.validate.outputs.location }}" --template-file modules/main.bicep --parameters deployment.generated.bicepparam

  deploy:
    name: 05 - Deploy complete infrastructure using Bicep
    needs: [validate,prepare,what-if]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-deployment-params
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy Resource Group, NSG, VNet, subnet, Public IP, NIC, VM and optional PIM
        shell: bash
        run: |
          set -euo pipefail
          az deployment sub create \
            --name "BIFROST-Deploy-${{ github.run_number }}" \
            --location "${{ needs.validate.outputs.location }}" \
            --template-file modules/main.bicep \
            --parameters deployment.generated.bicepparam \
            --output table
      - name: Deployment summary
        if: always()
        run: |
          echo "Resource Group: ${{ needs.validate.outputs.rg_name }}"
          echo "Deployment: BIFROST-Deploy-${{ github.run_number }}"
          echo "See the deployment output above for status."
