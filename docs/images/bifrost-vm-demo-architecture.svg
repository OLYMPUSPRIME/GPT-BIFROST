<rect x="55" y="410" width="580" height="180" rx="18" fill="#101f35" stroke="#fbbf24" stroke-width="2"/><text x="345" y="451" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#fff">📈 Next phase: Azure Monitor</text><text x="90" y="490" font-family="Segoe UI,Arial" font-size="18" fill="#fde68a">• Azure Monitor Agent + Data Collection Rules</text><text x="90" y="523" font-family="Segoe UI,Arial" font-size="18" fill="#fde68a">• CPU, memory, disk and heartbeat alerts</text><text x="90" y="556" font-family="Segoe UI,Arial" font-size="18" fill="#fde68a">• Pike Action Group + notification testing</text><path d="M700 690H655V500H635" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 6" fill="none"/><text x="55" y="650" font-family="Segoe UI,Arial" font-size="17" fill="#cbd5e1">⚠️ Demo scope: deploy only to a dedicated test subscription/resource group.</text><text x="55" y="682" font-family="Segoe UI,Arial" font-size="17" fill="#cbd5e1">Do not expose RDP/SSH publicly; allow only an approved admin IP.</text><text x="55" y="770" font-family="Segoe UI,Arial" font-size="15" fill="#93c5fd">Architecture illustration • Confirm OS image, region, VM size, networking and policy values in parameter files before deployment.</text>
